name: greencity-erp

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: greencity
      POSTGRES_PASSWORD: greencity
      POSTGRES_DB: greencity
    ports:
      - '5435:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U greencity']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  scraper:
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://greencity:greencity@postgres:5432/greencity
      REDIS_URL: redis://redis:6379
      ERP_BASE_URL: http://app.greencity.org.in
      PLAYWRIGHT_HEADLESS: 'true'
      SCRAPER_CONCURRENCY: 3
      SCRAPER_DELAY_MS: 700
      GENEALOGY_ENABLED: 'false'
      STORAGE_STATE_DIR: /data/sessions
      FAILURE_HTML_DIR: /data/failures
    volumes:
      - scraper_data:/data
      - ./packages/shared/src/selectors/generated:/app/packages/shared/src/selectors/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  genealogy-scraper:
    build:
      context: .
      dockerfile: apps/scraper/Dockerfile
    restart: unless-stopped
    command: ['node', 'apps/scraper/dist/genealogy-index.js']
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://greencity:greencity@postgres:5432/greencity
      REDIS_URL: redis://redis:6379
      ERP_BASE_URL: http://app.greencity.org.in
      PLAYWRIGHT_HEADLESS: 'true'
      SCRAPER_CONCURRENCY: 1
      # Turbo: admin panel cookie + HTTP tree HTML (~8-12 BP/min per slot × slots).
      GENEALOGY_CONCURRENCY: 8
      GENEALOGY_ADMIN_PANEL_SLOTS: 6
      GENEALOGY_HTTP_CONCURRENCY: 200
      GENEALOGY_HTTP_CONNECTIONS: 300
      SCRAPER_DELAY_MS: 0
      GENEALOGY_BP_ORDER: leaf_first
      GENEALOGY_AUTH_MODE: admin_panel
      GENEALOGY_PARALLEL_TREES: 'true'
      GENEALOGY_PARALLEL_MODULES: 'false'
      GENEALOGY_ENQUEUE_STAGGER_MS: 0
      GENEALOGY_PORTAL_RETRY_ATTEMPTS: 2
      GENEALOGY_PORTAL_RETRY_MS: 1000
      SCRAPER_BROWSER_POOL: 'true'
      SCRAPER_BLOCK_RESOURCES: 'true'
      SCRAPER_ADMIN_CONTEXT: 'false'
      BP_HARVEST_QUEUE: 'false'
      GENEALOGY_ENABLED: 'true'
      WORKER_ROLE: genealogy
      GENEALOGY_HTTP_ONLY: 'false'
      GENEALOGY_HTTP_HTML: 'true'
      GENEALOGY_HTTP_TREE_URL: ''
      GENEALOGY_HTTP_COOKIE: ''
      STORAGE_STATE_DIR: /data/sessions
      FAILURE_HTML_DIR: /data/failures
    volumes:
      - scraper_data:/data
      - ./packages/shared/src/selectors/generated:/app/packages/shared/src/selectors/generated
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://greencity:greencity@postgres:5432/greencity
      REDIS_URL: redis://redis:6379
      PORT: 3010
      GENEALOGY_CONCURRENCY: 50
      BP_HARVEST_QUEUE: 'true'
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY:-}
      INTEGRATION_CORS_ORIGIN: ${INTEGRATION_CORS_ORIGIN:-https://mlm-erp.example.com}
      INTEGRATION_RATE_LIMIT_POINTS: ${INTEGRATION_RATE_LIMIT_POINTS:-500}
      INTEGRATION_RATE_LIMIT_DURATION: ${INTEGRATION_RATE_LIMIT_DURATION:-60}
    ports:
      - '3010:3010'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  scraper_data:
